<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Вопросы">
<meta name="theme-color" content="#121110">
<title>Вопросы — интервью в свадебный день</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
:root{
  --bg:#121110; --panel:#1b1a18; --line:#2c2a26; --ivory:#efe8dc; --muted:#9a9186;
  --gold:#c9a45c; --gold-dim:#7d6740; --ok:#8fae7e;
  --serif: ui-serif, "New York", Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ivory);font-family:var(--sans)}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

/* шапка */
.top{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
.top h1{font-family:var(--serif);font-weight:400;font-size:26px;margin:0;flex:1;letter-spacing:.2px}
.top .sub{color:var(--muted);font-size:13px;margin-top:2px;font-family:var(--sans)}
.icon-btn{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;color:var(--muted);font-size:19px}
.icon-btn:active{background:var(--panel)}
.icon-btn.on{color:var(--gold)}

/* переключатель стороны */
.seg{display:flex;margin:6px 16px 10px;background:var(--panel);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{flex:1;padding:9px 0;border-radius:9px;color:var(--muted);font-size:15px}
.seg button.on{background:#2a2722;color:var(--ivory)}

/* главная */
.list{padding:4px 12px 24px}
.part{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 12px;border-bottom:1px solid var(--line)}
.part:active{background:var(--panel)}
.part .t{font-family:var(--serif);font-size:20px}
.part .w{color:var(--muted);font-size:13px;margin-top:3px}
.part .n{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap;text-align:right}
.part .n b{color:var(--gold);font-weight:500}
.bar{height:2px;background:var(--line);border-radius:1px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold-dim)}
.section-label{color:var(--gold);font-size:11px;letter-spacing:2px;text-transform:uppercase;padding:18px 12px 4px}
.wedding{margin:0 16px;padding:10px 12px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:14px;width:calc(100% - 32px);text-align:left}
.wedding b{color:var(--ivory);font-weight:500}

/* колода */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 16px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border:1px solid var(--line);border-radius:18px;font-size:13px;color:var(--muted)}
.chip.on{border-color:var(--gold-dim);color:var(--gold);background:#211d16}
.deck{flex:1;display:flex;flex-direction:column;padding:0 16px}
.card{flex:1;min-height:340px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px 22px 18px;display:flex;flex-direction:column;position:relative;touch-action:pan-y;transition:transform .18s ease,opacity .18s ease}
.card.asked{border-color:#2f3a2a}
.card.star{border-color:var(--gold-dim);box-shadow:0 0 0 1px var(--gold-dim) inset}
.card .meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase}
.card .role{color:var(--gold)}
.card .who{color:var(--muted)}
.card .q{font-family:var(--serif);font-size:clamp(26px,7.4vw,34px);line-height:1.22;margin:auto 0;padding:24px 0}
.card .hint{color:var(--muted);font-size:14px;line-height:1.4;font-style:italic;border-top:1px solid var(--line);padding-top:12px}
.card .marks{position:absolute;top:44px;right:22px;font-size:13px;color:var(--ok)}
.counter{text-align:center;color:var(--muted);font-size:13px;padding:10px 0 4px}
.actions{display:grid;grid-template-columns:56px 1fr 1fr 56px;gap:8px;padding:8px 16px 14px}
.actions button{height:58px;border-radius:16px;background:var(--panel);border:1px solid var(--line);font-size:15px}
.actions button:active{background:#25231f}
.actions .nav{font-size:22px;color:var(--muted)}
.actions .askbtn.on{color:var(--ok);border-color:#3c4a35}
.actions .starbtn{color:var(--gold)}
.actions .starbtn.on{background:#2a2216;border-color:var(--gold-dim)}
.sub-actions{display:flex;justify-content:center;gap:18px;padding:0 16px 14px;color:var(--muted);font-size:14px}
.sub-actions button{color:var(--muted);padding:6px}
.sub-actions .on{color:var(--gold)}
.empty{color:var(--muted);text-align:center;padding:60px 20px;font-size:15px;line-height:1.5}

/* журнал и советы */
.page{padding:4px 16px 30px}
.row{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:12px}
.row .tm{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;width:66px;flex:none;padding-top:3px}
.row .tx{font-family:var(--serif);font-size:17px;line-height:1.3}
.row .pt{color:var(--muted);font-size:12px;margin-top:3px}
.row .k{width:18px;flex:none;padding-top:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.btn{padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-size:14px}
.btn.gold{border-color:var(--gold-dim);color:var(--gold)}
.tips h2{font-family:var(--serif);font-weight:400;font-size:21px;margin:22px 0 6px;color:var(--gold)}
.tips p,.tips li{color:#d6cfc3;line-height:1.5;font-size:15px}
.tips ul{padding-left:18px}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);background:#2a2722;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* тёмный режим для зала и церкви */
body.dim{--ivory:#8c8274;--muted:#5d564c;--gold:#8d7444;--gold-dim:#4f4128;--panel:#0d0c0b;--line:#1d1b18;--bg:#000}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
